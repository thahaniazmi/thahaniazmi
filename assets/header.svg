<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Matching Cyberdeck Obsidian) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090714"/>
      <stop offset="45%" stop-color="#120e24"/>
      <stop offset="100%" stop-color="#17122e"/>
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#3B2667" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#7DCFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Glowing Holographic Text Gradient for AZMI (Dynamic Color Shift) -->
    <linearGradient id="nameAzmiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC;#7DCFFF;#E879F9;#8B5CF6;#C084FC" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#C084FC;#7DCFFF;#EC4899;#A855F7" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7DCFFF">
        <animate attributeName="stop-color" values="#7DCFFF;#E879F9;#C084FC;#7DCFFF;#7DCFFF" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Specular Light Beam Gradient for Name Shimmer Flare -->
    <linearGradient id="shimmerBeamGrad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#7DCFFF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#7DCFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#C084FC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>

    <!-- Geometric Clip for Name Shimmer Sweep -->
    <clipPath id="nameClip">
      <g transform="translate(420, 106)" text-anchor="middle">
        <text class="display" font-size="44" font-weight="900" letter-spacing="5px">
          THAHANI AZMI
        </text>
      </g>
    </clipPath>

    <!-- Radiant Underline Beam -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DCFFF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7DCFFF" stop-opacity="1"/>
      <stop offset="80%" stop-color="#C084FC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Center Core Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#3B0764" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090714" stop-opacity="0"/>
    </radialGradient>

    <!-- Pill Badge Gradients -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1333" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#140E29" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientLight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Dot Matrix Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#584578" opacity="0.2"/>
    </pattern>

    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, Menlo, Monaco, Consolas, monospace;
      }
      .display {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .pulse-online {
        animation: pulseDot 2.2s infinite ease-in-out;
      }

      @keyframes beamShimmer {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
      }
      .shimmer {
        animation: beamShimmer 3s infinite ease-in-out;
      }

      /* Hero Name Keyframe Animations */
      @keyframes nameGlowBreathe {
        0%, 100% { opacity: 0.22; }
        50% { opacity: 0.68; }
      }
      .name-glow-pulse {
        animation: nameGlowBreathe 3.2s infinite ease-in-out;
      }

      @keyframes nameCyanBreathe {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.45; }
      }
      .name-cyan-glow {
        animation: nameCyanBreathe 3.2s infinite ease-in-out;
        animation-delay: 0.5s;
      }

      @keyframes bracketPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }
      .bracket-pulse {
        animation: bracketPulse 3.2s infinite ease-in-out;
      }

      @keyframes diamondGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .diamond-pulse {
        animation: diamondGlow 2.2s infinite ease-in-out;
      }

      @keyframes floatTag {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2px); }
      }
      .floating-tag {
        animation: floatTag 4s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- ==================== OUTER SHELL ==================== -->
  <!-- Card Background -->
  <rect x="2" y="2" width="836" height="226" rx="14" fill="url(#bgGrad)"/>

  <!-- High-Tech Dot Matrix Pattern Overlay -->
  <rect x="2" y="2" width="836" height="226" rx="14" fill="url(#dotGrid)"/>

  <!-- Radial Core Ambient Glow -->
  <ellipse cx="420" cy="115" rx="320" ry="85" fill="url(#centerGlow)"/>

  <!-- Outer Neon Border -->
  <rect x="2" y="2" width="836" height="226" rx="14" fill="none" stroke="url(#cardBorder)" stroke-width="1.3"/>

  <!-- ==================== HUD HEADER CORNERS & SYSTEM STATUS ==================== -->
  <!-- Top-Left System ID Tag -->
  <g transform="translate(24, 26)">
    <!-- Corner Tech Bracket -->
    <path d="M 0 10 L 0 0 L 10 0" fill="none" stroke="#7DCFFF" stroke-width="1.5" opacity="0.8"/>
    <text x="16" y="7" class="mono" font-size="10" font-weight="600" letter-spacing="1">
      <tspan fill="#7DCFFF">ID</tspan><tspan fill="#64537E"> // </tspan><tspan fill="#C084FC">THAHANI_AZMI.DEV</tspan>
    </text>
  </g>

  <!-- Top-Right System Status Pill -->
  <g transform="translate(730, 24)">
    <rect x="-82" y="-12" width="164" height="24" rx="12" fill="#150F28" stroke="#3A2756" stroke-width="0.9"/>
    <!-- Glowing Green Status Indicator -->
    <circle cx="-64" cy="0" r="3.5" fill="#10B981" filter="url(#subtleGlow)" class="pulse-online"/>
    <text x="-50" y="3.5" class="mono" font-size="9" fill="#34D399" font-weight="700" letter-spacing="1.1">SYSTEM // ACTIVE</text>
  </g>

  <!-- Top Divider Track -->
  <line x1="24" y1="38" x2="816" y2="38" stroke="#251B40" stroke-width="1"/>

  <!-- ==================== HERO: FULL NAME DISPLAY ==================== -->
  <!-- Subtle Framing Tech Brackets -->
  <g class="bracket-pulse" opacity="0.45">
    <!-- Left Bracket -->
    <path d="M 120 78 L 105 78 L 105 138 L 120 138" fill="none" stroke="#7C3AED" stroke-width="1.6"/>
    <!-- Right Bracket -->
    <path d="M 720 78 L 735 78 L 735 138 L 720 138" fill="none" stroke="#7C3AED" stroke-width="1.6"/>
  </g>

  <!-- Centered Name Typography Group -->
  <g transform="translate(420, 106)" text-anchor="middle">
    <!-- Deep Ambient Violet Halo Glow (Breathing Pulse) -->
    <text class="display name-glow-pulse" font-size="44" font-weight="900" letter-spacing="5px" fill="#7C3AED" opacity="0.3" filter="url(#ambientLight)">
      THAHANI AZMI
    </text>

    <!-- Electric Cyan Core Glow (Harmonic Pulse) -->
    <text class="display name-cyan-glow" font-size="44" font-weight="900" letter-spacing="5px" fill="#7DCFFF" opacity="0.2" filter="url(#neonGlow)">
      THAHANI AZMI
    </text>

    <!-- Crisp Primary Name with Dual-Tone Split -->
    <text class="display" font-size="44" font-weight="900" letter-spacing="5px">
      <tspan fill="#F8FAFC" filter="url(#subtleGlow)">THAHANI </tspan>
      <tspan fill="url(#nameAzmiGrad)" filter="url(#neonGlow)">AZMI</tspan>
    </text>
  </g>

  <!-- Specular Light Sweep / Shimmer Flare Overlay Across Letters -->
  <g clip-path="url(#nameClip)">
    <rect y="55" width="140" height="65" fill="url(#shimmerBeamGrad)">
      <animate attributeName="x" values="70; 700; 700" keyTimes="0; 0.35; 1" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.04; 0.32; 0.35; 1" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Glowing Radiant Beam Underline with Center Diamond -->
  <g transform="translate(420, 126)">
    <line x1="-220" y1="0" x2="220" y2="0" stroke="url(#beamGrad)" stroke-width="1.5" class="shimmer"/>
    <!-- Center Glowing Cyber Diamond -->
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#7DCFFF" filter="url(#subtleGlow)" class="diamond-pulse"/>
  </g>

  <!-- Subtitle: Role & Architecture Focus -->
  <g transform="translate(420, 150)" text-anchor="middle">
    <text class="mono" font-size="12.5" font-weight="600" fill="#C084FC" letter-spacing="2.8px">
      <tspan fill="#7DCFFF">✦ </tspan>FULL STACK DEVELOPER<tspan fill="#64537E"> // </tspan>SOFTWARE ENGINEER<tspan fill="#7DCFFF"> ✦</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM HUD: PILL CHIPS & SPECS ==================== -->
  <g transform="translate(420, 188)" text-anchor="middle">
    <!-- Chip 1: Architecture -->
    <g transform="translate(-195, 0)">
      <g class="floating-tag">
        <rect x="-85" y="-11" width="170" height="22" rx="11" fill="url(#pillBg)" stroke="#372654" stroke-width="0.9"/>
        <text x="0" y="3.5" class="mono" font-size="9" fill="#E2E8F0" font-weight="600" letter-spacing="0.5">
          <tspan fill="#8B5CF6">⚡ </tspan>Scalable Systems
        </text>
      </g>
    </g>

    <!-- Chip 2: Tech Core -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-11" width="190" height="22" rx="11" fill="url(#pillBg)" stroke="#372654" stroke-width="0.9"/>
      <text x="0" y="3.5" class="mono" font-size="9" fill="#E2E8F0" font-weight="600" letter-spacing="0.5">
        <tspan fill="#7DCFFF">◈ </tspan>TypeScript &amp; Modern Web
      </text>
    </g>

    <!-- Chip 3: Design / Experience -->
    <g transform="translate(195, 0)">
      <g class="floating-tag">
        <rect x="-85" y="-11" width="170" height="22" rx="11" fill="url(#pillBg)" stroke="#372654" stroke-width="0.9"/>
        <text x="0" y="3.5" class="mono" font-size="9" fill="#E2E8F0" font-weight="600" letter-spacing="0.5">
          <tspan fill="#C084FC">✦ </tspan>Fluid UI Architecture
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom-Left & Bottom-Right Corner Tech Markers -->
  <g transform="translate(24, 206)">
    <path d="M 0 -10 L 0 0 L 10 0" fill="none" stroke="#6D5987" stroke-width="1.2" opacity="0.6"/>
  </g>
  <g transform="translate(816, 206)">
    <path d="M 0 -10 L 0 0 L -10 0" fill="none" stroke="#6D5987" stroke-width="1.2" opacity="0.6"/>
  </g>
</svg>
