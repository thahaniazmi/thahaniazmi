<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Portfolio Obsidian / Cosmic Void / Plum Surface #161616 -> #202020 -> #27222E) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="45%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#27222E"/>
    </linearGradient>

    <!-- Outer Border Gradient (Royal Violet #4B1C71 to Medium Orchid #7F4CA5 & Soft Rose #F472B6) -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F4CA5" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#4B1C71" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#F472B6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7F4CA5" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glowing Holographic Text Gradient for AZMI (Portfolio Muted Lavender #C8A9DF -> Medium Orchid #7F4CA5 -> Soft Rose #F472B6) -->
    <linearGradient id="nameAzmiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A9DF">
        <animate attributeName="stop-color" values="#C8A9DF;#F472B6;#EAEAEA;#7F4CA5;#C8A9DF" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7F4CA5">
        <animate attributeName="stop-color" values="#7F4CA5;#C8A9DF;#EC4899;#F472B6;#7F4CA5" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F472B6">
        <animate attributeName="stop-color" values="#F472B6;#EC4899;#C8A9DF;#7F4CA5;#F472B6" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Specular Light Beam Gradient for Name Shimmer Flare -->
    <linearGradient id="shimmerBeamGrad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#F472B6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#C8A9DF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7F4CA5" stop-opacity="0"/>
    </linearGradient>

    <!-- Geometric Clip for Name Shimmer Sweep -->
    <clipPath id="nameClip">
      <g transform="translate(420, 120)" text-anchor="middle">
        <text class="display" font-size="44" font-weight="900" letter-spacing="5px">
          THAHANI AZMI
        </text>
      </g>
    </clipPath>

    <!-- Radiant Underline Beam (Royal Violet #4B1C71 -> Medium Orchid #7F4CA5 -> Soft Rose #F472B6) -->
    <linearGradient id="beamGrad" x1="-220" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4B1C71" stop-opacity="0"/>
      <stop offset="20%" stop-color="#4B1C71" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="1"/>
      <stop offset="80%" stop-color="#7F4CA5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4B1C71" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Center Core Glow (Royal Violet #4B1C71 & Medium Orchid #7F4CA5 with Plum Fade) -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4B1C71" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#7F4CA5" stop-opacity="0.22"/>
      <stop offset="80%" stop-color="#EC4899" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#161616" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters & Glows -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientLight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Dot Matrix Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#7F4CA5" opacity="0.22"/>
    </pattern>

    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, Menlo, Monaco, Consolas, monospace;
      }
      .display {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .pulse-online {
        animation: pulseDot 2.2s infinite ease-in-out;
      }

      @keyframes beamShimmer {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
      }
      .shimmer {
        animation: beamShimmer 3s infinite ease-in-out;
      }

      /* Hero Name Keyframe Animations */
      @keyframes nameGlowBreathe {
        0%, 100% { opacity: 0.22; }
        50% { opacity: 0.68; }
      }
      .name-glow-pulse {
        animation: nameGlowBreathe 3.2s infinite ease-in-out;
      }

      @keyframes nameRoseBreathe {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.45; }
      }
      .name-rose-glow {
        animation: nameRoseBreathe 3.2s infinite ease-in-out;
        animation-delay: 0.5s;
      }

      @keyframes bracketPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }
      .bracket-pulse {
        animation: bracketPulse 3.2s infinite ease-in-out;
      }

      @keyframes diamondGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .diamond-pulse {
        animation: diamondGlow 2.2s infinite ease-in-out;
      }

    </style>
  </defs>

  <!-- ==================== OUTER SHELL ==================== -->
  <!-- Card Background -->
  <rect x="2" y="2" width="836" height="226" rx="14" fill="url(#bgGrad)"/>

  <!-- High-Tech Dot Matrix Pattern Overlay -->
  <rect x="2" y="2" width="836" height="226" rx="14" fill="url(#dotGrid)"/>

  <!-- Radial Core Ambient Glow -->
  <ellipse cx="420" cy="128" rx="320" ry="85" fill="url(#centerGlow)"/>

  <!-- Outer Neon Border -->
  <rect x="2" y="2" width="836" height="226" rx="14" fill="none" stroke="url(#cardBorder)" stroke-width="1.3"/>

  <!-- ==================== HUD HEADER CORNERS & SYSTEM STATUS ==================== -->
  <!-- Top-Left System ID Tag -->
  <g transform="translate(24, 26)">
    <!-- Corner Tech Bracket -->
    <path d="M 0 10 L 0 0 L 10 0" fill="none" stroke="#F472B6" stroke-width="1.5" opacity="0.85"/>
    <text x="16" y="7" class="mono" font-size="10" font-weight="600" letter-spacing="1">
      <tspan fill="#F472B6">ID</tspan><tspan fill="#4B1C71"> // </tspan><tspan fill="#EAEAEA">THAHANI_AZMI.DEV</tspan>
    </text>
  </g>

  <!-- Top Divider Track -->
  <line x1="24" y1="38" x2="816" y2="38" stroke="#4B1C71" stroke-width="1" opacity="0.6"/>

  <!-- ==================== HERO: FULL NAME DISPLAY ==================== -->
  <!-- Subtle Framing Tech Brackets -->
  <g class="bracket-pulse" opacity="0.5">
    <!-- Left Bracket -->
    <path d="M 120 88 L 105 88 L 105 152 L 120 152" fill="none" stroke="#7F4CA5" stroke-width="1.6"/>
    <!-- Right Bracket -->
    <path d="M 720 88 L 735 88 L 735 152 L 720 152" fill="none" stroke="#7F4CA5" stroke-width="1.6"/>
  </g>

  <!-- Centered Name Typography Group -->
  <g transform="translate(420, 120)" text-anchor="middle">
    <!-- Deep Ambient Royal Violet Halo Glow (Breathing Pulse) -->
    <text class="display name-glow-pulse" font-size="44" font-weight="900" letter-spacing="5px" fill="#7F4CA5" opacity="0.35" filter="url(#ambientLight)">
      THAHANI AZMI
    </text>

    <!-- Warm Soft Rose Core Glow (Harmonic Pulse) -->
    <text class="display name-rose-glow" font-size="44" font-weight="900" letter-spacing="5px" fill="#F472B6" opacity="0.25" filter="url(#neonGlow)">
      THAHANI AZMI
    </text>

    <!-- Crisp Primary Name with Dual-Tone Split (Mist White #EAEAEA & Chrome Violet #nameAzmiGrad) -->
    <text class="display" font-size="44" font-weight="900" letter-spacing="5px">
      <tspan fill="#EAEAEA" filter="url(#subtleGlow)">THAHANI </tspan><tspan fill="url(#nameAzmiGrad)" filter="url(#neonGlow)">AZMI</tspan>
    </text>
  </g>

  <!-- Specular Light Sweep / Shimmer Flare Overlay Across Letters -->
  <g clip-path="url(#nameClip)">
    <rect y="69" width="140" height="65" fill="url(#shimmerBeamGrad)">
      <animate attributeName="x" values="70; 700; 700" keyTimes="0; 0.35; 1" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.04; 0.32; 0.35; 1" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Glowing Radiant Beam Underline with Center Diamond -->
  <g transform="translate(420, 140)">
    <line x1="-220" y1="0" x2="220" y2="0" stroke="url(#beamGrad)" stroke-width="1.5" class="shimmer"/>
    <!-- Center Glowing Soft Rose Diamond -->
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#F472B6" filter="url(#subtleGlow)" class="diamond-pulse"/>
  </g>

  <!-- Subtitle: Role & Architecture Focus -->
  <g transform="translate(420, 164)" text-anchor="middle">
    <text class="mono" font-size="12.5" font-weight="600" fill="#C8A9DF" letter-spacing="2.8px">
      <tspan fill="#F472B6">✦ </tspan>FULL STACK DEVELOPER<tspan fill="#4B1C71"> // </tspan>SOFTWARE ENGINEER<tspan fill="#F472B6"> ✦</tspan>
    </text>
  </g>

  <!-- Bottom-Left & Bottom-Right Corner Tech Markers -->
  <g transform="translate(24, 206)">
    <path d="M 0 -10 L 0 0 L 10 0" fill="none" stroke="#4B1C71" stroke-width="1.2" opacity="0.7"/>
  </g>
  <g transform="translate(816, 206)">
    <path d="M 0 -10 L 0 0 L -10 0" fill="none" stroke="#4B1C71" stroke-width="1.2" opacity="0.7"/>
  </g>
</svg>