<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#0f1523"/>
    </linearGradient>

    <!-- Neon Emblem Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="cyberViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="cyberMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="emblemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .mono { font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .key { font-weight: 600; fill: #00F0FF; }
      .punct { fill: #6E7681; }
      .val { fill: #E6EDF3; font-weight: 400; }
      .val-accent { fill: #C084FC; font-weight: 500; }
      .val-highlight { fill: #38BDF8; font-weight: 500; }
      .status-text { fill: #34D399; font-weight: 500; }
      .comment { fill: #565f89; font-style: italic; }
      .term-title { fill: #8B949E; font-size: 12px; font-weight: 500; letter-spacing: 0.5px; }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      .pulsing-indicator {
        animation: pulseDot 2s infinite ease-in-out;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Outer Card Frame with Neon Cyber Border -->
  <rect x="2" y="2" width="836" height="426" rx="14" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="1.5"/>
  <rect x="2" y="2" width="836" height="426" rx="14" fill="none" stroke="url(#cyberCyan)" stroke-width="1" opacity="0.25"/>

  <!-- Terminal Title Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 824 2 Q 838 2 838 16 L 838 40 L 2 40 Z" fill="#111622" stroke="#1F293D" stroke-width="1"/>
  
  <!-- Window Control Buttons (Traffic Lights) -->
  <circle cx="24" cy="21" r="5.5" fill="#FF5F56"/>
  <circle cx="44" cy="21" r="5.5" fill="#FFBD2E"/>
  <circle cx="64" cy="21" r="5.5" fill="#27C93F"/>

  <!-- Window Header Title -->
  <text x="420" y="25" text-anchor="middle" class="mono term-title">thahani@cyberdeck:~ (fastfetch)</text>

  <!-- Window Divider -->
  <line x1="2" y1="40" x2="838" y2="40" stroke="#1E2638" stroke-width="1.2"/>

  <!-- ==================== LEFT SIDE: CYBER GEOMETRIC EMBLEM ==================== -->
  <g transform="translate(145, 185)">
    <!-- Ambient Hex Glow -->
    <polygon points="0,-105 91,-52 91,52 0,105 -91,52 -91,-52" 
             fill="none" stroke="url(#cyberViolet)" stroke-width="1.5" opacity="0.3" filter="url(#emblemGlow)"/>

    <!-- Outer Hexagon Frame -->
    <polygon points="0,-95 82,-47 82,47 0,95 -82,47 -82,-47" 
             fill="#0e1320" stroke="url(#cyberCyan)" stroke-width="2" filter="url(#neonGlow)"/>

    <!-- Concentric Inner Hexagon -->
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36" 
             fill="none" stroke="url(#cyberViolet)" stroke-width="1.5" opacity="0.8"/>

    <!-- Isometric Cube / Cyber Gem Core -->
    <!-- Top Face -->
    <polygon points="0,-54 46,-27 0,0 -46,-27" 
             fill="url(#cyberCyan)" opacity="0.85"/>
    <!-- Right Face -->
    <polygon points="0,0 46,-27 46,27 0,54" 
             fill="url(#cyberViolet)" opacity="0.95"/>
    <!-- Left Face -->
    <polygon points="-46,-27 0,0 0,54 -46,27" 
             fill="url(#cyberMagenta)" opacity="0.75"/>

    <!-- Inner Core Glyph / Stylized Intersection Lines -->
    <line x1="0" y1="0" x2="0" y2="54" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
    <line x1="0" y1="0" x2="46" y2="-27" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
    <line x1="0" y1="0" x2="-46" y2="-27" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>

    <!-- Futuristic Circuitry Nodes -->
    <circle cx="0" cy="-95" r="3.5" fill="#00F0FF" filter="url(#neonGlow)"/>
    <circle cx="82" cy="-47" r="3" fill="#8B5CF6"/>
    <circle cx="82" cy="47" r="3" fill="#00F0FF"/>
    <circle cx="0" cy="95" r="3.5" fill="#C084FC" filter="url(#neonGlow)"/>
    <circle cx="-82" cy="47" r="3" fill="#00F0FF"/>
    <circle cx="-82" cy="-47" r="3" fill="#8B5CF6"/>

    <!-- Center Cyber Pulse Dot -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" filter="url(#neonGlow)"/>
  </g>

  <!-- Left Side Badges / Sub-Emblem Labels -->
  <g transform="translate(145, 335)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#131A2B" stroke="#25324E" stroke-width="1"/>
    <circle cx="-68" cy="0" r="4" fill="#10B981" class="pulsing-indicator" filter="url(#neonGlow)"/>
    <text x="0" y="4" text-anchor="middle" class="mono" font-size="10.5" fill="#38BDF8" font-weight="600" letter-spacing="1.2">SYSTEM // ONLINE</text>
  </g>

  <g transform="translate(145, 368)">
    <text x="0" y="0" text-anchor="middle" class="mono comment" font-size="10">ARCH // x86_64 CYBERDECK</text>
  </g>

  <!-- Center Vertical Column Divider -->
  <line x1="285" y1="56" x2="285" y2="405" stroke="#1D2638" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- ==================== RIGHT SIDE: NEOFETCH SPECS ==================== -->
  <!-- Command Prompt line -->
  <g transform="translate(308, 70)">
    <text class="mono" font-size="13.5">
      <tspan fill="#00F0FF" font-weight="700">thahani</tspan>
      <tspan fill="#8B949E">@</tspan>
      <tspan fill="#C084FC" font-weight="700">cyberdeck</tspan>
      <tspan fill="#6E7681">:</tspan>
      <tspan fill="#38BDF8">~</tspan>
      <tspan fill="#6E7681">$ </tspan>
      <tspan fill="#F8FAFC" font-weight="500">fastfetch --profile</tspan>
    </text>
  </g>

  <!-- Subtitle Divider line -->
  <line x1="308" y1="84" x2="810" y2="84" stroke="#26334D" stroke-width="1.2"/>

  <!-- System Specifications Data -->
  <g class="mono" font-size="12" transform="translate(308, 108)">
    <!-- Row 1: OS -->
    <text y="0">
      <tspan class="key">OS</tspan>
      <tspan class="punct">........... </tspan>
      <tspan class="val">DevOS v3.8 </tspan>
      <tspan class="val-accent">(Tokyo Night Edition)</tspan>
    </text>

    <!-- Row 2: Role -->
    <text y="24">
      <tspan class="key">Host</tspan>
      <tspan class="punct">......... </tspan>
      <tspan class="val">Full-Stack Developer &amp; Software Engineer</tspan>
    </text>

    <!-- Row 3: Location -->
    <text y="48">
      <tspan class="key">Location</tspan>
      <tspan class="punct">..... </tspan>
      <tspan class="val">Sri Lanka </tspan>
      <tspan fill="#38BDF8">🇱🇰</tspan>
    </text>

    <!-- Row 4: Uptime -->
    <text y="72">
      <tspan class="key">Uptime</tspan>
      <tspan class="punct">....... </tspan>
      <tspan class="val">24/7 </tspan>
      <tspan class="comment">(Powered by Caffeine ☕ &amp; Clean Code)</tspan>
    </text>

    <!-- Row 5: Shell -->
    <text y="96">
      <tspan class="key">Shell</tspan>
      <tspan class="punct">........ </tspan>
      <tspan class="val">zsh 5.9 </tspan>
      <tspan class="punct">/ </tspan>
      <tspan class="val-highlight">TypeScript</tspan>
      <tspan class="punct"> / </tspan>
      <tspan class="val-accent">Python</tspan>
    </text>

    <!-- Row 6: Frontend -->
    <text y="120">
      <tspan class="key">Frontend</tspan>
      <tspan class="punct">..... </tspan>
      <tspan class="val">React, Next.js, Tailwind CSS, HTML5/CSS3</tspan>
    </text>

    <!-- Row 7: Backend -->
    <text y="144">
      <tspan class="key">Backend</tspan>
      <tspan class="punct">...... </tspan>
      <tspan class="val">Node.js, Express, Python, Django</tspan>
    </text>

    <!-- Row 8: Databases -->
    <text y="168">
      <tspan class="key">Databases</tspan>
      <tspan class="punct">.... </tspan>
      <tspan class="val">PostgreSQL, MongoDB, MySQL, Prisma ORM</tspan>
    </text>

    <!-- Row 9: DevOps & Tools -->
    <text y="192">
      <tspan class="key">DevOps/Env</tspan>
      <tspan class="punct">... </tspan>
      <tspan class="val">Docker, Git, GitHub Actions, Linux, VS Code</tspan>
    </text>

    <!-- Row 10: Status -->
    <text y="216">
      <tspan class="key">Status</tspan>
      <tspan class="punct">....... </tspan>
      <tspan class="status-text">● Available for innovative builds &amp; open source</tspan>
    </text>
  </g>

  <!-- Bottom Divider -->
  <line x1="308" y1="344" x2="810" y2="344" stroke="#26334D" stroke-width="1.2"/>

  <!-- Cyberpunk Terminal Color Swatches (Neofetch Color Blocks) -->
  <g transform="translate(308, 360)">
    <!-- Row 1: Standard ANSI Colors -->
    <rect x="0"   y="0" width="26" height="15" rx="3" fill="#1E222A"/>
    <rect x="32"  y="0" width="26" height="15" rx="3" fill="#F43F5E"/>
    <rect x="64"  y="0" width="26" height="15" rx="3" fill="#10B981"/>
    <rect x="96"  y="0" width="26" height="15" rx="3" fill="#F59E0B"/>
    <rect x="128" y="0" width="26" height="15" rx="3" fill="#3B82F6"/>
    <rect x="160" y="0" width="26" height="15" rx="3" fill="#8B5CF6"/>
    <rect x="192" y="0" width="26" height="15" rx="3" fill="#00F0FF"/>
    <rect x="224" y="0" width="26" height="15" rx="3" fill="#E2E8F0"/>

    <!-- Row 2: Bright Neon ANSI Colors -->
    <rect x="0"   y="20" width="26" height="15" rx="3" fill="#4B5563"/>
    <rect x="32"  y="20" width="26" height="15" rx="3" fill="#FB7185"/>
    <rect x="64"  y="20" width="26" height="15" rx="3" fill="#34D399"/>
    <rect x="96"  y="20" width="26" height="15" rx="3" fill="#FCD34D"/>
    <rect x="128" y="20" width="26" height="15" rx="3" fill="#60A5FA"/>
    <rect x="160" y="20" width="26" height="15" rx="3" fill="#C084FC"/>
    <rect x="192" y="20" width="26" height="15" rx="3" fill="#67E8F9"/>
    <rect x="224" y="20" width="26" height="15" rx="3" fill="#FFFFFF"/>

    <!-- Memory / Caffeine Meter Bar -->
    <g transform="translate(280, 5)">
      <text class="mono" font-size="10.5" fill="#8B949E" y="10">CAFFEINE</text>
      <!-- Meter Background -->
      <rect x="70" y="1" width="140" height="11" rx="4" fill="#1E2638"/>
      <!-- Meter Fill (99%) -->
      <rect x="71" y="2" width="136" height="9" rx="3" fill="url(#cyberCyan)"/>
      <text class="mono" font-size="10" fill="#00F0FF" font-weight="700" x="218" y="10">99%</text>

      <text class="mono" font-size="10.5" fill="#8B949E" y="30">PASSION</text>
      <!-- Meter Background -->
      <rect x="70" y="21" width="140" height="11" rx="4" fill="#1E2638"/>
      <!-- Meter Fill (100%) -->
      <rect x="71" y="22" width="138" height="9" rx="3" fill="url(#cyberViolet)"/>
      <text class="mono" font-size="10" fill="#C084FC" font-weight="700" x="218" y="30">100%</text>
    </g>
  </g>
</svg>
