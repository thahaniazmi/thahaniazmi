<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient (Portfolio Obsidian / Cosmic Void #161616 - #202020) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="45%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#19151F"/>
    </linearGradient>

    <!-- Structural Card Border Gradient (Royal Violet #4B1C71 to Medium Orchid #7F4CA5 & Soft Rose #F472B6) -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F4CA5" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#4B1C71" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#F472B6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7F4CA5" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Ambient Core Cosmic Nebula Glow (Radial Falloff: Royal Violet -> Medium Orchid -> Neon Pink) -->
    <radialGradient id="nebulaGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#4B1C71" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#7F4CA5" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#161616" stop-opacity="0"/>
    </radialGradient>

    <!-- Dynamic Shimmering Chrome Purple Text Gradient for AZMI -->
    <linearGradient id="nameAzmiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#EAEAEA"/>
      <stop offset="55%" stop-color="#C8A9DF"/>
      <stop offset="85%" stop-color="#7F4CA5"/>
      <stop offset="100%" stop-color="#4B1C71"/>
    </linearGradient>

    <!-- Chrome Violet Gradient for 'modern websites.' Tagline -->
    <linearGradient id="taglineChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="35%" stop-color="#D8B4FE"/>
      <stop offset="75%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7F4CA5"/>
    </linearGradient>

    <!-- Specular Light Beam Gradient for Name Shimmer Sweep -->
    <linearGradient id="shimmerBeamGrad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#C8A9DF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#7F4CA5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7F4CA5" stop-opacity="0"/>
    </linearGradient>

    <!-- Geometric Clip for Name Shimmer Sweep -->
    <clipPath id="nameClip">
      <g transform="translate(430, 96)" text-anchor="middle">
        <text class="display-title" font-size="38" font-weight="900" letter-spacing="5px">
          THAHANI AZMI
        </text>
      </g>
    </clipPath>

    <!-- Radiant Underline Beam Gradient -->
    <linearGradient id="beamGrad" x1="-220" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4B1C71" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7F4CA5" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#7F4CA5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4B1C71" stop-opacity="0"/>
    </linearGradient>

    <!-- Top Pill Badge Surface Gradient (Plum Surface #27222E with subtle glass highlight) -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33293D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#27222E" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F4CA5" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4B1C71" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientLight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Starburst Ray Glow Filters -->
    <filter id="starGlowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="starGlowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Cosmic Grid Pattern (Subtle Royal Violet Lines #4B1C71) -->
    <pattern id="cosmicGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#4B1C71" stroke-width="0.75" opacity="0.18"/>
      <circle cx="0" cy="0" r="0.8" fill="#7F4CA5" opacity="0.35"/>
    </pattern>

    <!-- Radial Mask for Grid (softly concentrates in the center, fades out towards edges) -->
    <radialGradient id="gridMaskGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect x="0" y="0" width="860" height="270" fill="url(#gridMaskGrad)"/>
    </mask>

    <!-- ==================== REUSABLE COSMIC STARBURSTS (From Portfolio Hero) ==================== -->
    <!-- Pink Cosmic Starburst (#F472B6) -->
    <g id="starburstPink">
      <!-- Outer Starlight Halo -->
      <circle cx="50" cy="50" r="42" fill="#F472B6" opacity="0.18" filter="url(#ambientLight)"/>
      <!-- Diagonal 4 Secondary Rays -->
      <path d="M50 20 C50 38 38 50 20 50 C38 50 50 62 50 80 C50 62 62 50 80 50 C62 50 50 38 50 20 Z"
            fill="#F472B6" opacity="0.6" transform="rotate(45 50 50)" filter="url(#starGlowPink)"/>
      <!-- Primary 4 Long Rays -->
      <path d="M50 4 C49 34 34 49 4 50 C34 51 49 66 50 96 C51 66 66 51 96 50 C66 49 51 34 50 4 Z"
            fill="#FCE7F3" opacity="0.9" filter="url(#starGlowPink)"/>
      <!-- Inner Brilliant Core Nucleus -->
      <circle cx="50" cy="50" r="4" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="50" cy="50" r="1.8" fill="#FFFFFF"/>
    </g>

    <!-- Purple Cosmic Starburst (#7F4CA5 / #C8A9DF) -->
    <g id="starburstPurple">
      <!-- Outer Starlight Halo -->
      <circle cx="50" cy="50" r="42" fill="#7F4CA5" opacity="0.22" filter="url(#ambientLight)"/>
      <!-- Diagonal 4 Secondary Rays -->
      <path d="M50 20 C50 38 38 50 20 50 C38 50 50 62 50 80 C50 62 62 50 80 50 C62 50 50 38 50 20 Z"
            fill="#9B64C4" opacity="0.65" transform="rotate(45 50 50)" filter="url(#starGlowPurple)"/>
      <!-- Primary 4 Long Rays -->
      <path d="M50 4 C49 34 34 49 4 50 C34 51 49 66 50 96 C51 66 66 51 96 50 C66 49 51 34 50 4 Z"
            fill="#E4D5F0" opacity="0.92" filter="url(#starGlowPurple)"/>
      <!-- Inner Brilliant Core Nucleus -->
      <circle cx="50" cy="50" r="3.8" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="50" cy="50" r="1.6" fill="#FFFFFF"/>
    </g>

    <!-- Micro Star Particle -->
    <g id="microStar">
      <polygon points="0,-4 1.2,-1.2 4,0 1.2,1.2 0,4 -1.2,1.2 -4,0 -1.2,-1.2" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, Menlo, Monaco, Consolas, monospace;
      }
      .display-title {
        font-family: 'Syne', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .sans-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
      }

      /* Bulletproof CSS Animations */
      @keyframes pulseOnlineDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      .pulse-dot {
        animation: pulseOnlineDot 2s infinite ease-in-out;
        transform-origin: center;
      }

      @keyframes beamShimmer {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }
      .beam-shimmer {
        animation: beamShimmer 3.2s infinite ease-in-out;
      }

      @keyframes nameGlowBreathe {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.65; }
      }
      .name-glow-pulse {
        animation: nameGlowBreathe 3.5s infinite ease-in-out;
      }

      @keyframes starFloatSoft {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(6deg); }
      }
      .star-float-1 {
        animation: starFloatSoft 5s infinite ease-in-out;
      }
      .star-float-2 {
        animation: starFloatSoft 6.5s infinite ease-in-out;
        animation-delay: 1s;
      }

      @keyframes twinkleFade {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 0.95; transform: scale(1.2); }
      }
      .twinkle-1 {
        animation: twinkleFade 3s infinite ease-in-out;
      }
      .twinkle-2 {
        animation: twinkleFade 4s infinite ease-in-out;
        animation-delay: 1.5s;
      }
    </style>
  </defs>

  <!-- ==================== OUTER SHELL ==================== -->
  <!-- Card Background Canvas (#161616 to #202020) -->
  <rect x="2" y="2" width="856" height="266" rx="16" fill="url(#bgGrad)"/>

  <!-- High-Tech Cosmic Grid with Smooth Radial Vignette Mask -->
  <rect x="2" y="2" width="856" height="266" rx="16" fill="url(#cosmicGrid)" mask="url(#gridMask)"/>

  <!-- Smooth Ambient Cosmic Nebula Glow -->
  <ellipse cx="430" cy="115" rx="360" ry="95" fill="url(#nebulaGlow)"/>

  <!-- Outer Structural Border (Royal Violet & Medium Orchid) -->
  <rect x="2" y="2" width="856" height="266" rx="16" fill="none" stroke="url(#cardBorder)" stroke-width="1.4"/>

  <!-- ==================== FLOATING COSMIC STARBURSTS (From Hero Screenshot) ==================== -->
  <!-- Starburst 1 (Top Left): Soft Rose (#F472B6) -->
  <g transform="translate(42, 30) scale(0.48)" class="star-float-1">
    <use href="#starburstPink"/>
  </g>

  <!-- Starburst 2 (Top Right): Medium Orchid (#7F4CA5) -->
  <g transform="translate(768, 38) scale(0.52)" class="star-float-2">
    <use href="#starburstPurple"/>
  </g>

  <!-- Twinkling Ambient Micro Sparkles Scattered in Space -->
  <g transform="translate(135, 115) scale(0.8)" class="twinkle-1">
    <use href="#microStar" fill="#F472B6"/>
  </g>
  <g transform="translate(735, 125) scale(0.7)" class="twinkle-2">
    <use href="#microStar" fill="#C8A9DF"/>
  </g>
  <g transform="translate(245, 38) scale(0.6)" class="twinkle-2">
    <use href="#microStar" fill="#FFFFFF"/>
  </g>
  <g transform="translate(625, 42) scale(0.65)" class="twinkle-1">
    <use href="#microStar" fill="#F472B6"/>
  </g>

  <!-- ==================== TOP COSMIC PILL BADGE ==================== -->
  <!-- Centered at x=430, y=28 (Matches Portfolio Hero Pill: ✦ SYSTEM ONLINE • RAPID BESPOKE LAUNCH 🟢) -->
  <g transform="translate(430, 28)">
    <!-- Frosted Pill Container -->
    <rect x="-172" y="-12" width="344" height="25" rx="12.5" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
    
    <!-- Left Starburst Icon (Soft Rose #F472B6) -->
    <g transform="translate(-154, 0.5)">
      <polygon points="0,-4.5 1.4,-1.4 4.5,0 1.4,1.4 0,4.5 -1.4,1.4 -4.5,0 -1.4,-1.4" fill="#F472B6" filter="url(#subtleGlow)"/>
    </g>

    <!-- Pill Monospace Text -->
    <text x="-4" y="3.8" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#EAEAEA" letter-spacing="1.1px">
      SYSTEM ONLINE <tspan fill="#7F4CA5">&#8226;</tspan> RAPID BESPOKE LAUNCH
    </text>

    <!-- Right Pulsing Live Status Dot (Emerald / Cyber Cyan #22D3EE) -->
    <g transform="translate(150, 0.5)">
      <!-- Outer Glow Ring -->
      <circle cx="0" cy="0" r="4.5" fill="#22D3EE" opacity="0.3" filter="url(#subtleGlow)"/>
      <!-- Core Pulsing Dot -->
      <circle cx="0" cy="0" r="2.8" fill="#34D399" class="pulse-dot"/>
    </g>
  </g>

  <!-- ==================== HERO: FULL NAME DISPLAY ==================== -->
  <!-- Framing Tech Brackets in Subtle Royal Violet -->
  <g opacity="0.5">
    <path d="M 175 72 L 160 72 L 160 116 L 175 116" fill="none" stroke="#4B1C71" stroke-width="1.5"/>
    <path d="M 685 72 L 700 72 L 700 116 L 685 116" fill="none" stroke="#4B1C71" stroke-width="1.5"/>
  </g>

  <!-- Centered Name Typography -->
  <g transform="translate(430, 96)" text-anchor="middle">
    <!-- Ambient Halo Glow behind text -->
    <text class="display-title name-glow-pulse" font-size="38" font-weight="900" letter-spacing="5px" fill="#7F4CA5" opacity="0.35" filter="url(#ambientLight)">
      THAHANI AZMI
    </text>

    <!-- Crisp Dual-Tone Name: THAHANI (Mist White #EAEAEA) + AZMI (Chrome Violet Gradient) -->
    <text class="display-title" font-size="38" font-weight="900" letter-spacing="5px">
      <tspan fill="#EAEAEA" filter="url(#subtleGlow)">THAHANI </tspan><tspan fill="url(#nameAzmiGrad)" filter="url(#neonGlow)">AZMI</tspan>
    </text>
  </g>

  <!-- Specular Shimmer Sweep Across Letters -->
  <g clip-path="url(#nameClip)">
    <rect y="55" width="150" height="55" fill="url(#shimmerBeamGrad)">
      <animate attributeName="x" values="120; 680; 680" keyTimes="0; 0.38; 1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.05; 0.34; 0.38; 1" dur="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ==================== HERO TAGLINE (Direct from Portfolio Hero) ==================== -->
  <!-- "I design & build modern websites." -->
  <g transform="translate(430, 133)" text-anchor="middle">
    <text class="sans-sub" font-size="19" font-weight="700" letter-spacing="-0.3px">
      <tspan fill="#EAEAEA">I design &amp; build </tspan>
      <tspan fill="url(#taglineChrome)" filter="url(#subtleGlow)">modern websites.</tspan>
    </text>
  </g>

  <!-- Subtitle Description (Direct from Portfolio Hero) -->
  <g transform="translate(430, 160)" text-anchor="middle">
    <text class="sans-sub" font-size="12" font-weight="400" fill="#B5B5B5" letter-spacing="0.2px">
      Fast, responsive, bespoke web experiences <tspan fill="#7F4CA5">&#8226;</tspan> Clean code &amp; rapid turnaround
    </text>
  </g>

  <!-- ==================== RADIANT UNDERLINE BEAM ==================== -->
  <g transform="translate(430, 184)">
    <line x1="-190" y1="0" x2="190" y2="0" stroke="url(#beamGrad)" stroke-width="1.3" class="beam-shimmer"/>
    <!-- Center Sparkling Diamond (Soft Rose #F472B6) -->
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#F472B6" filter="url(#subtleGlow)"/>
  </g>

  <!-- ==================== TECH STACK STRIP (Matches Portfolio Hero Strip) ==================== -->
  <!-- ⚛ React 19   TS TypeScript   ☁ Cloudflare   ✦ Tailwind CSS   ⚡ Vite -->
  <g transform="translate(430, 222)" text-anchor="middle">
    <!-- Item 1: React 19 -->
    <g transform="translate(-230, 0)">
      <text class="mono" font-size="11.5" font-weight="500">
        <tspan fill="#7F4CA5" font-weight="700">⚛ </tspan><tspan fill="#B5B5B5">React 19</tspan>
      </text>
    </g>

    <!-- Item 2: TypeScript -->
    <g transform="translate(-115, 0)">
      <text class="mono" font-size="11.5" font-weight="500">
        <tspan fill="#7F4CA5" font-weight="700">TS </tspan><tspan fill="#B5B5B5">TypeScript</tspan>
      </text>
    </g>

    <!-- Item 3: Cloudflare -->
    <g transform="translate(0, 0)">
      <text class="mono" font-size="11.5" font-weight="500">
        <tspan fill="#7F4CA5" font-weight="700">☁ </tspan><tspan fill="#B5B5B5">Cloudflare</tspan>
      </text>
    </g>

    <!-- Item 4: Tailwind CSS -->
    <g transform="translate(115, 0)">
      <text class="mono" font-size="11.5" font-weight="500">
        <tspan fill="#F472B6" font-weight="700">✦ </tspan><tspan fill="#B5B5B5">Tailwind CSS</tspan>
      </text>
    </g>

    <!-- Item 5: Vite -->
    <g transform="translate(230, 0)">
      <text class="mono" font-size="11.5" font-weight="500">
        <tspan fill="#22D3EE" font-weight="700">⚡ </tspan><tspan fill="#B5B5B5">Vite</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== CORNER HUD ACCENTS ==================== -->
  <g transform="translate(22, 22)" opacity="0.6">
    <path d="M 0 10 L 0 0 L 10 0" fill="none" stroke="#7F4CA5" stroke-width="1.2"/>
  </g>
  <g transform="translate(838, 22)" opacity="0.6">
    <path d="M 0 10 L 0 0 L -10 0" fill="none" stroke="#7F4CA5" stroke-width="1.2"/>
  </g>
  <g transform="translate(22, 248)" opacity="0.6">
    <path d="M 0 -10 L 0 0 L 10 0" fill="none" stroke="#7F4CA5" stroke-width="1.2"/>
  </g>
  <g transform="translate(838, 248)" opacity="0.6">
    <path d="M 0 -10 L 0 0 L -10 0" fill="none" stroke="#7F4CA5" stroke-width="1.2"/>
  </g>
</svg>