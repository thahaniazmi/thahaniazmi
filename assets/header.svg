<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Cosmic Canvas Gradient -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120E18"/>
      <stop offset="45%" stop-color="#191322"/>
      <stop offset="85%" stop-color="#161120"/>
      <stop offset="100%" stop-color="#100C16"/>
    </linearGradient>

    <!-- Structural Outer Border Gradient -->
    <linearGradient id="outerBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F4CA5" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#4B1C71" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#F472B6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7F4CA5" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Ambient Core Cosmic Nebula Glow (Radial Falloff) -->
    <radialGradient id="nebulaCore" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4B1C71" stop-opacity="0.36"/>
      <stop offset="35%" stop-color="#7F4CA5" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#EC4899" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#120E18" stop-opacity="0"/>
    </radialGradient>

    <!-- Top-Left Pink Starlight Ambient Radiance -->
    <radialGradient id="pinkAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#DB2777" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#120E18" stop-opacity="0"/>
    </radialGradient>

    <!-- Top-Right Violet Starlight Ambient Radiance -->
    <radialGradient id="violetAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7F4CA5" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#4B1C71" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#120E18" stop-opacity="0"/>
    </radialGradient>

    <!-- Liquid Chrome Violet Gradient for 'modern websites.' -->
    <linearGradient id="modernWebsitesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FAF5FF"/>
      <stop offset="48%" stop-color="#D8B4FE"/>
      <stop offset="78%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7F4CA5"/>
    </linearGradient>

    <!-- Primary CTA Button Gradient ('Start a project →') -->
    <linearGradient id="btnPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B21A8"/>
      <stop offset="50%" stop-color="#7F4CA5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Secondary CTA Button Gradient ('Explore My Works') -->
    <linearGradient id="btnSecondaryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2338" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1C1626" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Jellyfish Gradients (From Portfolio JellyfishLogo.jsx) -->
    <linearGradient id="jfBellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F472B6"/>
      <stop offset="70%" stop-color="#7F4CA5"/>
      <stop offset="100%" stop-color="#4B1C71"/>
    </linearGradient>

    <linearGradient id="jfBellFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#7F4CA5" stop-opacity="0.88"/>
      <stop offset="60%" stop-color="#4B1C71" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#202020" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="jfCoreGrad" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FCE7F3"/>
      <stop offset="55%" stop-color="#EC4899"/>
      <stop offset="80%" stop-color="#7F4CA5"/>
      <stop offset="100%" stop-color="#4B1C71" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="jfTentCyan" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#A855F7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="jfTentMag" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#C084FC" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Starburst Ray Glow Filters -->
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="haloBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7F4CA5" flood-opacity="0.4"/>
    </filter>

    <!-- Cosmic Grid Pattern (40x40 subtle lines) -->
    <pattern id="cosmicGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4B1C71" stroke-width="0.6" opacity="0.14"/>
    </pattern>

    <!-- Radial Mask for Grid (Diffuses grid out to nothingness at boundaries) -->
    <radialGradient id="gridMaskGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect x="0" y="0" width="1000" height="480" fill="url(#gridMaskGrad)"/>
    </mask>

    <!-- Micro Starlight Point -->
    <g id="microStar">
      <polygon points="0,-4 1.2,-1.2 4,0 1.2,1.2 0,4 -1.2,1.2 -4,0 -1.2,-1.2" fill="#FFFFFF"/>
    </g>

    <style>
      .display-sans {
        font-family: 'Plus Jakarta Sans', 'Syne', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .body-sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .mono-tech {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, Menlo, Consolas, monospace;
      }

      /* Subtle Ambient CSS Animations */
      @keyframes starBreathe {
        0%, 100% { opacity: 0.75; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      .star-glow-1 {
        animation: starBreathe 4s infinite ease-in-out;
        transform-origin: center;
      }
      .star-glow-2 {
        animation: starBreathe 5.5s infinite ease-in-out;
        animation-delay: 1.2s;
        transform-origin: center;
      }

      @keyframes twinkleParticle {
        0%, 100% { opacity: 0.25; transform: scale(0.7); }
        50% { opacity: 0.95; transform: scale(1.25); }
      }
      .twinkle-a {
        animation: twinkleParticle 3.2s infinite ease-in-out;
      }
      .twinkle-b {
        animation: twinkleParticle 4.5s infinite ease-in-out;
        animation-delay: 1.5s;
      }
      .twinkle-c {
        animation: twinkleParticle 3.8s infinite ease-in-out;
        animation-delay: 0.8s;
      }
    </style>
  </defs>

  <!-- ==================== BASE CANVAS & ATMOSPHERE ==================== -->
  <!-- Dark Obsidian Cosmic Background -->
  <rect x="2" y="2" width="996" height="476" rx="16" fill="url(#cosmicBg)"/>

  <!-- Faint Cosmic Grid Overlay -->
  <rect x="2" y="2" width="996" height="476" rx="16" fill="url(#cosmicGrid)" mask="url(#gridMask)"/>

  <!-- Large Central Purple Nebula Glow -->
  <ellipse cx="500" cy="230" rx="420" ry="170" fill="url(#nebulaCore)"/>

  <!-- Ambient Light Halos behind floating stars -->
  <circle cx="58" cy="120" r="100" fill="url(#pinkAmbientGlow)"/>
  <circle cx="900" cy="185" r="120" fill="url(#violetAmbientGlow)"/>

  <!-- Outer Card Frame (Very subtle edge sheen) -->
  <rect x="2" y="2" width="996" height="476" rx="16" fill="none" stroke="url(#outerBorderGrad)" stroke-width="1.2"/>

  <!-- ==================== TOP NAVIGATION BAR (Exact Replica of Portfolio Header) ==================== -->
  <g transform="translate(0, 32)">
    <!-- Brand Logo: Jellyfish + "Thahani Azmi ✦" -->
    <g transform="translate(42, 0)">
      <!-- Mini Bioluminescent Jellyfish -->
      <g transform="translate(0, -14) scale(0.24)">
        <!-- Tentacles -->
        <path d="M 25 49 C 20 59, 28 69, 22 79 C 17 87, 23 91, 19 96" stroke="url(#jfTentCyan)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
        <path d="M 35 51 C 30 61, 39 71, 33 81 C 28 88, 34 92, 30 98" stroke="url(#jfTentMag)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
        <path d="M 65 51 C 70 61, 61 71, 67 81 C 72 88, 66 92, 70 98" stroke="url(#jfTentCyan)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
        <path d="M 75 49 C 80 59, 72 69, 78 79 C 83 87, 77 91, 81 96" stroke="url(#jfTentMag)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
        <!-- Oral Arms -->
        <path d="M 46 50 C 42 59, 52 66, 45 77 C 41 84, 47 88, 44 94" stroke="url(#jfTentCyan)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95"/>
        <path d="M 54 50 C 58 59, 48 66, 55 77 C 59 84, 53 88, 56 94" stroke="url(#jfTentMag)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95"/>
        <!-- Bell -->
        <path d="M 18 48 C 18 27, 32 13, 50 13 C 68 13, 82 27, 82 48 C 76 53, 71 49, 66 52 C 60 55, 56 49, 50 51 C 44 49, 40 55, 34 52 C 29 49, 24 53, 18 48 Z" fill="url(#jfBellFill)" stroke="url(#jfBellGrad)" stroke-width="2.4" stroke-linejoin="round"/>
        <!-- Glowing Core -->
        <ellipse cx="50" cy="36" rx="9" ry="11" fill="url(#jfCoreGrad)" opacity="0.95"/>
        <circle cx="50" cy="40" r="2.6" fill="#FAF5FF" opacity="0.95"/>
      </g>

      <!-- Brand Text -->
      <text x="32" y="3.5" class="display-sans" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="-0.2px">
        Thahani Azmi <tspan fill="#F472B6" font-size="12">&#10022;</tspan>
      </text>
    </g>

    <!-- Top-Right Navigation Links -->
    <g transform="translate(958, 2.5)" text-anchor="end" class="display-sans" font-size="11.5" font-weight="500" fill="#C8A9DF">
      <text x="0" y="0">
        <tspan fill="#EAEAEA" font-weight="600">What I Do</tspan>
        <tspan fill="#584578">&#160; &#160; </tspan>
        <tspan fill="#C8A9DF">My Works</tspan>
        <tspan fill="#584578">&#160; &#160; </tspan>
        <tspan fill="#C8A9DF">Offerings</tspan>
        <tspan fill="#584578">&#160; &#160; </tspan>
        <tspan fill="#C8A9DF">Skills</tspan>
        <tspan fill="#584578">&#160; &#160; </tspan>
        <tspan fill="#C8A9DF">About</tspan>
        <tspan fill="#584578">&#160; &#160; </tspan>
        <tspan fill="#C8A9DF">Process</tspan>
        <tspan fill="#584578">&#160; &#160; </tspan>
        <tspan fill="#C8A9DF">Contact</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== LARGE FLOATING COSMIC STARBURSTS ==================== -->
  <!-- Left Big Starburst (Soft Rose #F472B6) -->
  <g transform="translate(58, 120)" class="star-glow-1">
    <!-- Outer Halo -->
    <circle cx="0" cy="0" r="48" fill="#F472B6" opacity="0.22" filter="url(#glowPink)"/>
    <!-- 4 Diagonal Secondary Rays -->
    <g transform="rotate(45)">
      <path d="M 0 -24 C 0 -10, -8 0, -20 0 C -8 0, 0 10, 0 24 C 0 10, 8 0, 20 0 C 8 0, 0 -10, 0 -24 Z" fill="#F472B6" opacity="0.65" filter="url(#glowPink)"/>
    </g>
    <!-- 4 Primary Long Rays -->
    <path d="M 0 -46 C -1 -12, -12 -1, -46 0 C -12 1, -1 12, 0 46 C 1 12, 12 1, 46 0 C 12 -1, 1 -12, 0 -46 Z" fill="#FCE7F3" opacity="0.95" filter="url(#glowPink)"/>
    <!-- Core Nucleus -->
    <circle cx="0" cy="0" r="4.2" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Right Big Starburst (Medium Orchid #7F4CA5 / Muted Lavender #C8A9DF) -->
  <g transform="translate(900, 185)" class="star-glow-2">
    <!-- Outer Halo -->
    <circle cx="0" cy="0" r="50" fill="#7F4CA5" opacity="0.25" filter="url(#glowPurple)"/>
    <!-- 4 Diagonal Secondary Rays -->
    <g transform="rotate(45)">
      <path d="M 0 -26 C 0 -11, -9 0, -22 0 C -9 0, 0 11, 0 26 C 0 11, 9 0, 22 0 C 9 0, 0 -11, 0 -26 Z" fill="#9B64C4" opacity="0.68" filter="url(#glowPurple)"/>
    </g>
    <!-- 4 Primary Long Rays -->
    <path d="M 0 -48 C -1 -13, -13 -1, -48 0 C -13 1, -1 13, 0 48 C 1 13, 13 1, 48 0 C 13 -1, 1 -13, 0 -48 Z" fill="#E4D5F0" opacity="0.95" filter="url(#glowPurple)"/>
    <!-- Core Nucleus -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- Micro Twinkling Starlight Points in Space -->
  <g transform="translate(240, 95) scale(0.85)" class="twinkle-a">
    <use href="#microStar" fill="#F472B6"/>
  </g>
  <g transform="translate(790, 105) scale(0.9)" class="twinkle-b">
    <use href="#microStar" fill="#C8A9DF"/>
  </g>
  <g transform="translate(170, 335) scale(0.75)" class="twinkle-c">
    <use href="#microStar" fill="#FFFFFF"/>
  </g>
  <g transform="translate(835, 360) scale(0.8)" class="twinkle-a">
    <use href="#microStar" fill="#F472B6"/>
  </g>
  <g transform="translate(440, 75) scale(0.65)" class="twinkle-b">
    <use href="#microStar" fill="#22D3EE"/>
  </g>
  <g transform="translate(685, 385) scale(0.7)" class="twinkle-c">
    <use href="#microStar" fill="#FFFFFF"/>
  </g>
  <g transform="translate(48, 365) scale(0.6)" class="twinkle-a">
    <use href="#microStar" fill="#C8A9DF"/>
  </g>

  <!-- ==================== HERO MAIN HEADLINE (Matches Image 2 Exactly) ==================== -->
  <!-- Line 1: "I design & build" -->
  <text x="500" y="162" text-anchor="middle" class="display-sans" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5px">
    I design &amp; build
  </text>

  <!-- Line 2: "modern websites." in Liquid Chrome Violet -->
  <text x="500" y="228" text-anchor="middle" class="display-sans" font-size="54" font-weight="800" fill="url(#modernWebsitesGrad)" letter-spacing="-1.5px" filter="url(#subtleGlow)">
    modern websites.
  </text>

  <!-- ==================== SUBTITLE COPY (3-Line Clean Paragraph from Image 2) ==================== -->
  <g transform="translate(500, 268)" text-anchor="middle" class="body-sans" font-size="14.2" font-weight="400" fill="#C8A9DF" letter-spacing="0.1px">
    <text x="0" y="0">Fast, responsive, bespoke web experiences for businesses, clinics,</text>
    <text x="0" y="21">and creators. Clean code, sub-0.4s load times, and rapid turnaround</text>
    <text x="0" y="42">from idea to launch.</text>
  </g>

  <!-- ==================== CALL TO ACTION BUTTONS (Exact Replica from Image 2) ==================== -->
  <g transform="translate(500, 362)">
    <!-- Button 1 (Left): "Start a project →" -->
    <g transform="translate(-190, -22)" filter="url(#btnShadow)">
      <!-- Pill Container -->
      <rect x="0" y="0" width="176" height="44" rx="22" fill="url(#btnPrimaryGrad)" stroke="rgba(244,114,182,0.4)" stroke-width="1.2"/>
      <!-- Button Text -->
      <text x="74" y="27" text-anchor="middle" class="display-sans" font-size="13.5" font-weight="600" fill="#FFFFFF" letter-spacing="-0.1px">
        Start a project
      </text>
      <!-- Arrow Right Icon -->
      <g transform="translate(136, 22)">
        <line x1="-6" y1="0" x2="6" y2="0" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
        <polyline points="2,-4 6,0 2,4" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Button 2 (Right): "Explore My Works" -->
    <g transform="translate(14, -22)">
      <!-- Pill Container with Translucent Plum Surface -->
      <rect x="0" y="0" width="180" height="44" rx="22" fill="url(#btnSecondaryBg)" stroke="rgba(127,76,165,0.45)" stroke-width="1.2"/>
      
      <!-- Layers / Stack Icon -->
      <g transform="translate(32, 22)">
        <!-- Top Isometric Diamond -->
        <polygon points="0,-5 8,-1 0,3 -8,-1" fill="none" stroke="#A855F7" stroke-width="1.4" stroke-linejoin="round"/>
        <!-- Bottom Isometric Layer Arc -->
        <polyline points="-8,3 0,7 8,3" fill="none" stroke="#A855F7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Button Text -->
      <text x="104" y="27" text-anchor="middle" class="display-sans" font-size="13.5" font-weight="500" fill="#EAEAEA" letter-spacing="-0.1px">
        Explore My Works
      </text>
    </g>
  </g>

  <!-- ==================== TECH STACK STRIP (From Image 2 Footer) ==================== -->
  <!-- ⚛ React 19   TS TypeScript   ☁ Cloudflare   ✦ Tailwind CSS   ⚡ Vite -->
  <g transform="translate(500, 442)" text-anchor="middle" class="mono-tech" font-size="12" font-weight="500">
    <!-- Item 1: React 19 -->
    <g transform="translate(-240, 0)">
      <text x="0" y="0">
        <tspan fill="#A855F7" font-weight="700">⚛ </tspan><tspan fill="#B5B5B5">React 19</tspan>
      </text>
    </g>

    <!-- Item 2: TypeScript -->
    <g transform="translate(-120, 0)">
      <text x="0" y="0">
        <tspan fill="#A855F7" font-weight="700">TS </tspan><tspan fill="#B5B5B5">TypeScript</tspan>
      </text>
    </g>

    <!-- Item 3: Cloudflare -->
    <g transform="translate(0, 0)">
      <text x="0" y="0">
        <tspan fill="#A855F7" font-weight="700">☁ </tspan><tspan fill="#B5B5B5">Cloudflare</tspan>
      </text>
    </g>

    <!-- Item 4: Tailwind CSS -->
    <g transform="translate(120, 0)">
      <text x="0" y="0">
        <tspan fill="#F472B6" font-weight="700">✦ </tspan><tspan fill="#B5B5B5">Tailwind CSS</tspan>
      </text>
    </g>

    <!-- Item 5: Vite -->
    <g transform="translate(240, 0)">
      <text x="0" y="0">
        <tspan fill="#22D3EE" font-weight="700">⚡ </tspan><tspan fill="#B5B5B5">Vite</tspan>
      </text>
    </g>
  </g>
</svg>